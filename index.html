<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>North Pole Dispatch</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #17352b;
        background: #f4f3e8;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        max-width: 38rem;
        margin: 2rem;
        padding: 2.5rem;
        border: 2px solid #b52e35;
        border-radius: 1rem;
        background: #fffdf5;
        box-shadow: 0 1rem 3rem #17352b22;
      }

      h1 {
        color: #b52e35;
      }

      .hint {
        margin-top: 2rem;
        padding: 1rem;
        border-left: 4px solid #16804a;
        background: #eaf3e9;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>North Pole Dispatch</h1>
      <p>All sleighs are fueled, the reindeer are ready, and the presents are sorted.</p>
      <p>One delivery manifest has gone missing from the dispatch desk.</p>
      <div class="hint">
        <strong>Elf Scout's tip:</strong>
        I always check the site's robots.txt. The elf who copied our route map was one step ahead.
      </div>
    </main>
  </body>
</html>
